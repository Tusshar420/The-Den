<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="position:relative; display:inline-block; flex:none; width:{{ px }}; height:{{ px }}; vertical-align:middle;">
<svg viewBox="0 0 80 80" width="100%" height="100%" role="img" aria-label="Octopus" style="display:block; overflow:visible; animation:{{ svgAnim }};">
  <sc-if value="{{ glowWait }}" hint-placeholder-val="{{ false }}"><circle cx="40" cy="34" r="34" fill="rgba(255,181,71,.12)"></circle></sc-if>
  <sc-if value="{{ glowWork }}" hint-placeholder-val="{{ false }}"><circle cx="40" cy="34" r="34" fill="rgba(69,224,200,.10)"></circle></sc-if>
  <sc-if value="{{ dance }}" hint-placeholder-val="{{ false }}"><ellipse cx="40" cy="79" rx="17" ry="3" fill="rgba(255,123,92,.32)" style="transform-origin:40px 79px; animation:octo-shadow .9s ease-in-out infinite;"></ellipse></sc-if>
  <g style="transform-origin:40px 72px; animation:{{ bodyAnim }};">
    <g>
      <g style="transform-origin:18px 50px; animation:octo-wig {{ speed }} ease-in-out 0s infinite;"><path d="M18 48 q -5 10 1 18 q 3 5 -4 6" stroke="#FF7B5C" stroke-width="6.5" stroke-linecap="round" fill="none"></path></g>
      <g style="transform-origin:27px 50px; animation:octo-wig {{ speed }} ease-in-out .16s infinite;"><path d="M27 48 q 5 10 -1 18 q -3 5 4 6" stroke="#FF7B5C" stroke-width="6.5" stroke-linecap="round" fill="none"></path></g>
      <g style="transform-origin:36px 50px; animation:octo-wig {{ speed }} ease-in-out .32s infinite;"><path d="M36 48 q -5 10 1 18 q 3 5 -4 6" stroke="#FF7B5C" stroke-width="6.5" stroke-linecap="round" fill="none"></path></g>
      <g style="transform-origin:45px 50px; animation:octo-wig {{ speed }} ease-in-out .48s infinite;"><path d="M45 48 q 5 10 -1 18 q -3 5 4 6" stroke="#FF7B5C" stroke-width="6.5" stroke-linecap="round" fill="none"></path></g>
      <g style="transform-origin:54px 50px; animation:octo-wig {{ speed }} ease-in-out .64s infinite;"><path d="M54 48 q -5 10 1 18 q 3 5 -4 6" stroke="#FF7B5C" stroke-width="6.5" stroke-linecap="round" fill="none"></path></g>
      <g style="transform-origin:62px 50px; animation:octo-wig {{ speed }} ease-in-out .80s infinite;"><path d="M62 48 q 5 10 -1 18 q -3 5 4 6" stroke="#FF7B5C" stroke-width="6.5" stroke-linecap="round" fill="none"></path></g>
    </g>
    <path d="M13 40 C13 16 26 6 40 6 C54 6 67 16 67 40 C67 49 57 53 40 53 C23 53 13 49 13 40 Z" fill="#FF7B5C"></path>
    <ellipse cx="29" cy="17" rx="7" ry="4" fill="#fff" opacity=".2" transform="rotate(-20 29 17)"></ellipse>
    <sc-if value="{{ eyesShut }}" hint-placeholder-val="{{ false }}"><path d="M26 34 q5 4 10 0 M44 34 q5 4 10 0" stroke="#0B1016" stroke-width="2.6" stroke-linecap="round" fill="none"></path></sc-if>
    <sc-if value="{{ eyesHappy }}" hint-placeholder-val="{{ true }}"><path d="M26 35 q5 -6 10 0 M44 35 q5 -6 10 0" stroke="#0B1016" stroke-width="2.8" stroke-linecap="round" fill="none"></path></sc-if>
    <sc-if value="{{ eyesOpen }}" hint-placeholder-val="{{ false }}">
      <g style="transform-origin:40px 34px; animation:octo-blink 4.5s infinite;">
        <ellipse cx="31" cy="34" rx="{{ erx }}" ry="{{ ery }}" fill="#FFF3EC"></ellipse><ellipse cx="49" cy="34" rx="{{ erx }}" ry="{{ ery }}" fill="#FFF3EC"></ellipse>
        <circle cx="31" cy="{{ py }}" r="{{ pr }}" fill="#0B1016"></circle><circle cx="49" cy="{{ py }}" r="{{ pr }}" fill="#0B1016"></circle>
        <sc-if value="{{ glint }}" hint-placeholder-val="{{ false }}"><circle cx="32.2" cy="31.4" r="1.1" fill="#fff"></circle><circle cx="50.2" cy="31.4" r="1.1" fill="#fff"></circle></sc-if>
        <sc-if value="{{ brows }}" hint-placeholder-val="{{ false }}"><path d="M25 25 l9 3 M55 25 l-9 3" stroke="#0B1016" stroke-width="2.4" stroke-linecap="round"></path></sc-if>
      </g>
    </sc-if>
    <sc-if value="{{ dance }}" hint-placeholder-val="{{ false }}"><ellipse cx="23" cy="42" rx="4" ry="2.4" fill="#FF5470" opacity=".45"></ellipse><ellipse cx="57" cy="42" rx="4" ry="2.4" fill="#FF5470" opacity=".45"></ellipse></sc-if>
  </g>
  <sc-if value="{{ eyesShut }}" hint-placeholder-val="{{ false }}"><text x="62" y="10" fill="#A58BFF" font-size="12" font-family="JetBrains Mono" style="animation:octo-zz 2.4s infinite;">z</text></sc-if>
</svg>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script>
// The Den's octopus - the same character as the old dashboard (static/js/octopus.js), with its moods:
//   wait  approval pending (big eyes, glint, amber glow, bob)   work  a task is running (pupils down, teal glow, fast tentacles)
//   sleep rate-limited / paused (closed eyes, slow tentacles, "z")   idle  nothing to do (happy eyes)
//   error last task failed (small pupils, brows)                 dance loading (hop + sway, blush, shadow)
// Props: mood, size (px). The keyframes (octo-wig, octo-blink, ...) live in DenHome's <style>.
class Component extends DCLogic {
  renderVals() {
    const mood = ['wait', 'work', 'sleep', 'idle', 'error', 'dance'].includes(this.props.mood) ? this.props.mood : 'idle';
    const size = +this.props.size || 40;
    const sleep = mood === 'sleep', dance = mood === 'dance', work = mood === 'work', wait = mood === 'wait';
    const r = wait ? 7.5 : 6.5;
    return {
      px: size + 'px', speed: (sleep ? 5 : dance ? 0.45 : work ? 1.1 : 2.2) + 's',
      svgAnim: wait ? 'octo-bob 2s ease-in-out infinite' : 'none', bodyAnim: dance ? 'octo-dance .9s ease-in-out infinite' : 'none',
      glowWait: wait, glowWork: work, dance,
      eyesShut: sleep, eyesHappy: mood === 'idle' || dance, eyesOpen: wait || work || mood === 'error',
      erx: String(r - 1), ery: String(r), py: String(34 + (work ? 3 : wait ? -1.5 : 0)), pr: String(mood === 'error' ? 2.2 : 3.4),
      glint: wait, brows: mood === 'error'
    };
  }
}
</script>
</body>
</html>
