<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; gap:14px; align-items:stretch; max-width:1480px; margin:0 auto; min-height:calc(100vh - 220px); font-family:'Bricolage Grotesque', system-ui, sans-serif; color:#E8EEF3;">
  <sc-if value="{{ showList }}" hint-placeholder-val="{{ true }}">
    <div style="flex:{{ listFlex }}; min-width:0; display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; gap:8px;">
        <div style="flex:1; min-width:0; height:42px; display:flex; align-items:center; gap:10px; padding:0 12px; border-radius:13px; background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.08);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#93A1B0" style="flex:none; stroke-width:1.8; stroke-linecap:round;"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14M20 20l-4-4"></path></svg>
          <input value="{{ q }}" onChange="{{ onQ }}" placeholder="Search notes" style="flex:1; min-width:0; border:0; outline:none; background:transparent; color:#E8EEF3; font-family:inherit; font-size:14.5px;">
        </div>
        <button onClick="{{ newNote }}" title="New note" style="flex:none; width:42px; height:42px; display:grid; place-items:center; border-radius:13px; border:0; background:#FF7B5C; color:#1A0A05; cursor:pointer;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2.2; stroke-linecap:round;"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
      <div style="display:flex; gap:4px; flex-wrap:wrap;">
        <sc-for list="{{ tags }}" as="t" hint-placeholder-count="5"><button onClick="{{ t.pick }}" style="height:28px; padding:0 10px; border-radius:999px; cursor:pointer; font-size:12px; font-weight:600; background:{{ t.bg }}; color:{{ t.fg }}; border:1px solid {{ t.bd }};">{{ t.label }}</button></sc-for>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
        <sc-for list="{{ notes }}" as="n" hint-placeholder-count="5">
          <button onClick="{{ n.pick }}" style="display:flex; flex-direction:column; gap:5px; padding:12px 14px; border-radius:15px; cursor:pointer; text-align:left; background:{{ n.bg }}; border:1px solid {{ n.bd }}; color:#E8EEF3; backdrop-filter:blur(18px);">
            <span style="display:flex; align-items:center; gap:8px;"><sc-if value="{{ n.pinned }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="#FFB547" stroke="#FFB547" style="flex:none; stroke-width:1.5;"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></sc-if><span style="flex:1; min-width:0; font-size:14px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ n.title }}</span><span style="font-family:'JetBrains Mono', monospace; font-size:10.5px; color:#6B7A8A;">{{ n.when }}</span></span>
            <span style="font-size:12.5px; line-height:1.5; color:#93A1B0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{ n.body }}</span>
            <span style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:#93A1B0;"><span style="width:6px; height:6px; border-radius:2px; background:{{ n.pc }};"></span>{{ n.project }}</span>
          </button>
        </sc-for>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
          <div style="padding:36px 16px; border-radius:16px; border:1px dashed rgba(255,255,255,0.1); text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center;"><div style="font-size:15px; font-weight:700;">No notes yet</div><div style="font-size:12.5px; color:#93A1B0;">Jot anything — or say “note that…” to Octopus.</div></div>
        </sc-if>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ showEditor }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1 1 0; min-width:0; display:flex; flex-direction:column; border-radius:20px; background:rgba(20,28,38,0.5); border:1px solid rgba(255,255,255,0.07); backdrop-filter:blur(22px); overflow:hidden;">
      <div style="display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,0.06); flex-wrap:wrap;">
        <sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}"><button onClick="{{ back }}" style="width:36px; height:36px; display:grid; place-items:center; border-radius:10px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.04); cursor:pointer; color:#C2CDD8;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2; stroke-linecap:round; stroke-linejoin:round;"><path d="M15 6l-6 6 6 6"></path></svg></button></sc-if>
        <select ref="{{ fixSel }}" data-v="{{ cur.project }}" value="{{ cur.project }}" onChange="{{ onProject }}" style="height:32px; padding:0 8px; border-radius:9px; border:1px solid rgba(255,255,255,0.1); background:#141B24; color:#C2CDD8; font-family:inherit; font-size:12.5px; cursor:pointer;"><sc-for list="{{ projOpts }}" as="o" hint-placeholder-count="5"><option value="{{ o }}">{{ o }}</option></sc-for></select>
        <span style="flex:1;"></span>
        <span style="font-size:11.5px; color:#6B7A8A;">{{ saved }}</span>
        <button onClick="{{ pin }}" title="Pin" style="width:34px; height:34px; display:grid; place-items:center; border-radius:10px; border:0; background:transparent; cursor:pointer; color:{{ pinFg }};"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ pinFill }}" stroke="currentColor" style="stroke-width:1.8; stroke-linejoin:round;"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></button>
        <button onClick="{{ del }}" title="Delete" style="width:34px; height:34px; display:grid; place-items:center; border-radius:10px; border:0; background:transparent; cursor:pointer; color:#93A1B0;" style-hover="color:#FF8FA2;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
      </div>
      <div style="flex:1; min-height:0; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:12px;">
        <input value="{{ cur.title }}" onChange="{{ onTitle }}" placeholder="Untitled" style="border:0; outline:none; background:transparent; color:#E8EEF3; font-family:inherit; font-size:24px; font-weight:750; letter-spacing:-.015em;">
        <textarea value="{{ cur.body }}" onChange="{{ onBody }}" placeholder="Start writing…" style="flex:1; min-height:260px; resize:none; border:0; outline:none; background:transparent; color:#DCE4EB; font-family:inherit; font-size:15px; line-height:1.75;"></textarea>
        <sc-if value="{{ summary }}" hint-placeholder-val="{{ false }}">
          <div style="padding:12px 14px; border-radius:14px; background:rgba(165,139,255,0.07); border:1px solid rgba(165,139,255,0.25); font-size:13px; line-height:1.6; color:#DCE4EB;"><b style="color:#C9B8FF;">Summary:</b> {{ summary }}</div>
        </sc-if>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; padding:12px 14px; border-top:1px solid rgba(255,255,255,0.06);">
        <button onClick="{{ toTask }}" style="height:34px; display:flex; align-items:center; gap:6px; padding:0 13px; border-radius:10px; border:0; background:#FF7B5C; color:#1A0A05; cursor:pointer; font-size:12.5px; font-weight:700;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;"><path d="M5 12l5 5 9-10"></path></svg>Turn into task</button>
        <button onClick="{{ summarize }}" style="height:34px; padding:0 13px; border-radius:10px; border:1px solid rgba(165,139,255,0.3); background:rgba(165,139,255,0.08); cursor:pointer; font-size:12.5px; font-weight:650; color:#C9B8FF;">Summarize</button>
        <button onClick="{{ remind }}" style="height:34px; padding:0 13px; border-radius:10px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.04); cursor:pointer; font-size:12.5px; font-weight:650; color:#DCE4EB;">Remind me</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const C = { coral:'#FF7B5C', amber:'#FFB547', teal:'#45E0C8', err:'#FF5470', blue:'#7FB2FF', violet:'#A58BFF', green:'#6FCF97' };
const PC = { 'The Den':C.coral, KodeAura7:C.blue, 'Sanskrit exam paper':'#E6C07B', 'Law Accounting site':'#7FD1B9', General:C.green };
const N0 = [
  { id:1, title:'Den redesign — open questions', body:'Pin any project tab — where do pinned tabs live across projects?\nWidget system: should modules ship their own widgets?\nQueue templates later.', project:'The Den', when:'today', pinned:1 },
  { id:2, title:'Abhishek · weekly sync', body:'Board drag needs stage history. Demo Thursday 16:30. Invoice before Friday.', project:'KodeAura7', when:'Mon', pinned:1 },
  { id:3, title:'Paper set C ideas', body:'More sandhi questions; shorter comprehension passage; one unseen verse.', project:'Sanskrit exam paper', when:'Sat', pinned:0 },
  { id:4, title:'Launch checklist', body:'DNS TTL lowered · SSL ok · analytics · 404 page · contact form test · backups on.', project:'Law Accounting site', when:'Fri', pinned:0 },
  { id:5, title:'Things to try with voice', body:'Wake word “Octo”, approvals by voice, read me the morning briefing while driving.', project:'General', when:'2w', pinned:0 }
];
class Component extends DCLogic {
  componentDidMount() { this.props.onReady && this.props.onReady(); }
  fixSel = el => { if (el) requestAnimationFrame(() => { const v = el.getAttribute('data-v'); if (v != null && el.value !== v) el.value = v; }); };
  state = { notes:N0, sel:1, q:'', tag:'All', phoneOpen:false, saved:'Saved', summary:{} };
  say(t, s, c) { this.props.say && this.props.say(t, s, c); }
  upd(patch) { const id = this.state.sel; this.setState(s => ({ notes:s.notes.map(n => n.id === id ? { ...n, ...patch, when:'now' } : n), saved:'Saving…' })); clearTimeout(this.st); this.st = setTimeout(() => this.setState({ saved:'Saved' }), 700); }
  componentWillUnmount() { clearTimeout(this.st); }
  renderVals() {
    const s = this.state; const isPhone = !!this.props.isPhone; const ql = s.q.trim().toLowerCase();
    const list = s.notes.filter(n => (s.tag === 'All' || (s.tag === 'Pinned' ? n.pinned : n.project === s.tag)) && (!ql || (n.title + n.body).toLowerCase().includes(ql))).sort((a, b) => b.pinned - a.pinned);
    const cur = s.notes.find(n => n.id === s.sel) || s.notes[0] || { title:'', body:'', project:'General', pinned:0 };
    return {
      fixSel: this.fixSel,
      isPhone, showList: !isPhone || !s.phoneOpen, showEditor: (!isPhone || s.phoneOpen) && s.notes.length > 0, listFlex:'0 0 340px', back:() => this.setState({ phoneOpen:false }),
      q:s.q, onQ:e => this.setState({ q:e.target.value }),
      tags:['All', 'Pinned', ...Object.keys(PC)].map(t => ({ label:t, pick:() => this.setState({ tag:t }), bg: s.tag === t ? 'rgba(255,123,92,0.14)' : 'rgba(255,255,255,0.03)', fg: s.tag === t ? '#FFA48C' : '#A3B0BE', bd: s.tag === t ? 'rgba(255,123,92,0.35)' : 'rgba(255,255,255,0.07)' })),
      notes: list.map(n => ({ ...n, title:n.title || 'Untitled', pinned:!!n.pinned, pc:PC[n.project], bg: n.id === cur.id ? 'rgba(255,123,92,0.08)' : 'rgba(20,28,38,0.45)', bd: n.id === cur.id ? 'rgba(255,123,92,0.3)' : 'rgba(255,255,255,0.06)', pick:() => this.setState({ sel:n.id, phoneOpen:true }) })),
      empty: !list.length, cur, saved:s.saved, projOpts:Object.keys(PC),
      onTitle:e => this.upd({ title:e.target.value }), onBody:e => this.upd({ body:e.target.value }), onProject:e => this.upd({ project:e.target.value }),
      pin:() => this.upd({ pinned: cur.pinned ? 0 : 1 }), pinFg: cur.pinned ? '#FFB547' : '#93A1B0', pinFill: cur.pinned ? '#FFB547' : 'none',
      newNote:() => { const id = Date.now(); this.setState(st => ({ notes:[{ id, title:'', body:'', project:'General', when:'now', pinned:0 }, ...st.notes], sel:id, phoneOpen:true, tag:'All', q:'' })); },
      del:() => { this.setState(st => { const rest = st.notes.filter(n => n.id !== cur.id); return { notes:rest, sel: rest[0] ? rest[0].id : null, phoneOpen:false }; }); this.say('Note moved to Recycle bin', cur.title || 'Untitled', C.err); },
      summary: s.summary[cur.id] || '', summarize:() => this.setState(st => ({ summary:{ ...st.summary, [cur.id]: (cur.body.split(/[.\n]/).filter(Boolean).slice(0, 2).join('; ') || 'Nothing to summarize yet') + '.' } })),
      toTask:() => this.say('Queued as a task', (cur.title || 'Untitled') + ' → ' + cur.project, C.coral), remind:() => this.say('Reminder set', 'Tomorrow 09:00 · ' + (cur.title || 'Untitled'), C.amber)
    };
  }
}
</script>
</body>
</html>
