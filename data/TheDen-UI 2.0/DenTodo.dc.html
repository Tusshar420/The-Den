<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ rootRef }}" style="position:relative; display:flex; flex-direction:column; gap:10px; min-width:0; font-family:'Bricolage Grotesque', system-ui, sans-serif; color:#E8EEF3;">

  <div style="display:flex; flex-direction:column; gap:8px; padding:10px; border-radius:14px; background:rgba(255,255,255,0.03); border:1px solid {{ addBd }}; transition:border-color .15s;">
    <div style="display:flex; align-items:flex-start; gap:8px;">
      <span style="flex:none; width:20px; height:20px; margin-top:7px; display:grid; place-items:center; border-radius:50%; border:1.5px dashed rgba(255,255,255,0.22); color:#6B7A8A;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:3; stroke-linecap:round;"><path d="M12 5v14M5 12h14"></path></svg></span>
      <textarea value="{{ text }}" onChange="{{ onText }}" onKeyDown="{{ onKey }}" onPaste="{{ onPaste }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" rows="{{ taRows }}" placeholder="{{ ph }}" style="flex:1; min-width:0; resize:none; padding:6px 0; border:0; outline:none; background:transparent; color:#E8EEF3; font-family:inherit; font-size:14px; line-height:1.5;"></textarea>
    </div>
    <sc-if value="{{ showAddOpts }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; align-items:center; gap:4px; flex-wrap:wrap; padding-left:28px;">
        <sc-if value="{{ unscoped }}" hint-placeholder-val="{{ true }}">
          <div data-todo-menu="1" style="position:relative;">
            <button onMouseDown="{{ keep }}" onClick="{{ addProjToggle }}" style="height:26px; display:flex; align-items:center; gap:6px; padding:0 9px; border-radius:999px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.03); cursor:pointer; font-family:inherit; font-size:11.5px; font-weight:650; color:#DCE4EB;"><span style="width:7px; height:7px; border-radius:2px; background:{{ addProjC }};"></span>{{ addProjName }}</button>
            <sc-if value="{{ addProjOpen }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute; top:calc(100% + 4px); left:0; z-index:40; width:210px; padding:5px; border-radius:12px; background:rgba(15,21,29,0.98); border:1px solid rgba(255,255,255,0.1); box-shadow:0 20px 50px -18px rgba(0,0,0,0.85);">
                <sc-for list="{{ addProjOpts }}" as="p" hint-placeholder-count="5"><button onMouseDown="{{ keep }}" onClick="{{ p.pick }}" style="width:100%; display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; border:0; background:{{ p.bg }}; cursor:pointer; text-align:left; font-family:inherit; font-size:12.5px; font-weight:600; color:#E8EEF3;"><span style="width:8px; height:8px; border-radius:2px; background:{{ p.c }};"></span>{{ p.name }}</button></sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>
        <sc-for list="{{ addPrios }}" as="p" hint-placeholder-count="3"><button onMouseDown="{{ keep }}" onClick="{{ p.pick }}" title="{{ p.label }}" style="width:26px; height:26px; display:grid; place-items:center; border-radius:8px; border:1px solid {{ p.bd }}; background:{{ p.bg }}; cursor:pointer; color:{{ p.c }};"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg></button></sc-for>
        <span style="width:1px; height:16px; margin:0 3px; background:rgba(255,255,255,0.08);"></span>
        <sc-for list="{{ addDues }}" as="d" hint-placeholder-count="3"><button onMouseDown="{{ keep }}" onClick="{{ d.pick }}" style="height:26px; padding:0 9px; border-radius:999px; border:1px solid {{ d.bd }}; background:{{ d.bg }}; cursor:pointer; font-family:inherit; font-size:11.5px; font-weight:650; color:{{ d.fg }};">{{ d.label }}</button></sc-for>
        <span style="flex:1;"></span>
        <button onMouseDown="{{ keep }}" onClick="{{ addNow }}" style="height:26px; padding:0 11px; border-radius:8px; border:0; background:#FF7B5C; cursor:pointer; font-family:inherit; font-size:12px; font-weight:700; color:#1A0A05;">Add ↵</button>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ hasPend }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:14px; background:rgba(255,123,92,0.06); border:1px solid rgba(255,123,92,0.3); animation:denRise .16s cubic-bezier(.2,.7,.3,1);">
      <div style="display:flex; align-items:center; gap:8px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFA48C" style="stroke-width:2; stroke-linecap:round; stroke-linejoin:round;"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg><span style="flex:1; font-size:13px; font-weight:700;">{{ pendTitle }}</span><span style="font-size:11px; color:#93A1B0;">bullets &amp; numbers removed</span></div>
      <div style="display:flex; flex-direction:column; gap:2px; max-height:200px; overflow-y:auto;">
        <sc-for list="{{ pend }}" as="p" hint-placeholder-count="4"><div style="display:flex; align-items:center; gap:8px; min-height:30px; padding:0 4px 0 8px; border-radius:8px; background:rgba(6,9,13,0.35);"><span style="flex:none; width:14px; height:14px; border-radius:50%; border:1.5px solid {{ p.ring }}; background:{{ p.fill }};"></span><span style="flex:1; min-width:0; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#DCE4EB;">{{ p.text }}</span><sc-if value="{{ p.meta }}" hint-placeholder-val="{{ false }}"><span style="flex:none; font-family:'JetBrains Mono', monospace; font-size:10px; color:#93A1B0;">{{ p.meta }}</span></sc-if><button onClick="{{ p.rm }}" title="Skip this line" style="flex:none; width:22px; height:22px; border-radius:6px; border:0; background:transparent; cursor:pointer; color:#6B7A8A;">×</button></div></sc-for>
      </div>
      <div style="display:flex; gap:6px;"><button onClick="{{ pendCancel }}" style="height:32px; padding:0 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.04); cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:650; color:#DCE4EB;">Cancel</button><button onClick="{{ pendAdd }}" style="flex:1; height:32px; border-radius:10px; border:0; background:#FF7B5C; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:700; color:#1A0A05;">{{ pendBtn }}</button></div>
    </div>
  </sc-if>

  <div style="display:flex; align-items:center; gap:6px;">
    <div style="flex:1; min-width:0; display:flex; gap:2px; padding:3px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06);">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3"><button onClick="{{ f.pick }}" style="flex:1; min-width:0; white-space:nowrap; height:26px; display:flex; align-items:center; justify-content:center; gap:5px; border-radius:7px; border:0; cursor:pointer; font-family:inherit; font-size:12px; font-weight:650; background:{{ f.bg }}; color:{{ f.fg }};">{{ f.label }}<span style="font-family:'JetBrains Mono', monospace; font-size:10px; opacity:.7;">{{ f.n }}</span></button></sc-for>
    </div>
    <div data-todo-menu="1" style="position:relative; flex:none;">
      <button onClick="{{ sortToggle }}" title="Sort" style="height:32px; display:flex; align-items:center; gap:5px; padding:0 9px; border-radius:10px; border:1px solid {{ sortBd }}; background:rgba(255,255,255,0.04); cursor:pointer; font-family:inherit; font-size:12px; font-weight:650; color:#C2CDD8;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2; stroke-linecap:round; stroke-linejoin:round;"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg><sc-if value="{{ wide }}" hint-placeholder-val="{{ false }}"><span>{{ sortLabel }}</span></sc-if></button>
      <sc-if value="{{ sortOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; top:calc(100% + 4px); right:0; z-index:40; width:190px; padding:5px; border-radius:12px; background:rgba(15,21,29,0.98); border:1px solid rgba(255,255,255,0.1); box-shadow:0 20px 50px -18px rgba(0,0,0,0.85); animation:denRise .14s cubic-bezier(.2,.7,.3,1);">
          <div style="padding:5px 9px; font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:.12em; color:#6B7A8A;">SORT BY</div>
          <sc-for list="{{ sorts }}" as="o" hint-placeholder-count="6"><button onClick="{{ o.pick }}" style="width:100%; display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; border:0; background:{{ o.bg }}; cursor:pointer; text-align:left; font-family:inherit; font-size:12.5px; font-weight:600; color:#E8EEF3;"><span style="flex:1;">{{ o.label }}</span><sc-if value="{{ o.on }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FF7B5C" style="stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;"><path d="M5 12l5 5 9-10"></path></svg></sc-if></button></sc-for>
        </div>
      </sc-if>
    </div>
    <button onClick="{{ selToggle }}" title="Select multiple" style="flex:none; width:32px; height:32px; display:grid; place-items:center; border-radius:10px; border:1px solid {{ selBtnBd }}; background:{{ selBtnBg }}; cursor:pointer; color:{{ selBtnFg }};"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2; stroke-linecap:round; stroke-linejoin:round;"><path d="M4 4h6v6H4zM14 7h6M4 14h6v6H4zM14 17h6M5.5 17l1.5 1.5 2.5-3"></path></svg></button>
    <div data-todo-menu="1" style="position:relative; flex:none;">
      <button onClick="{{ moreToggle }}" title="More" style="width:32px; height:32px; display:grid; place-items:center; border-radius:10px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.04); cursor:pointer; color:#C2CDD8;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:3; stroke-linecap:round;"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button>
      <sc-if value="{{ moreOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; top:calc(100% + 4px); right:0; z-index:40; width:210px; padding:5px; border-radius:12px; background:rgba(15,21,29,0.98); border:1px solid rgba(255,255,255,0.1); box-shadow:0 20px 50px -18px rgba(0,0,0,0.85); animation:denRise .14s cubic-bezier(.2,.7,.3,1);">
          <sc-for list="{{ moreActs }}" as="a" hint-placeholder-count="4"><button onClick="{{ a.run }}" style="width:100%; display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; border:0; background:transparent; cursor:pointer; text-align:left; font-family:inherit; font-size:12.5px; font-weight:600; color:{{ a.fg }};" style-hover="background:rgba(255,255,255,0.05);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="flex:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;"><path d="{{ a.icon }}"></path></svg>{{ a.label }}</button></sc-for>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:2px;">
    <sc-for list="{{ list }}" as="r" hint-placeholder-count="6"><div style="display:flex; flex-direction:column; min-width:0;">
      <sc-if value="{{ r.isHead }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; align-items:center; gap:7px; padding:10px 4px 4px;"><span style="width:7px; height:7px; border-radius:2px; background:{{ r.c }};"></span><span style="font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.1em; color:#93A1B0;">{{ r.label }}</span><span style="font-family:'JetBrains Mono', monospace; font-size:10px; color:#5B6A7A;">{{ r.n }}</span></div>
      </sc-if>
      <sc-if value="{{ r.isRow }}" hint-placeholder-val="{{ true }}">
        <div draggable="{{ r.draggable }}" onDragStart="{{ r.dStart }}" onDragOver="{{ r.dOver }}" onDrop="{{ r.dDrop }}" onDragEnd="{{ r.dEnd }}" onMouseEnter="{{ r.hin }}" onMouseLeave="{{ r.hout }}" onClick="{{ r.rowClick }}" style="position:relative; display:flex; align-items:flex-start; gap:10px; padding:8px 6px 8px 8px; border-radius:11px; background:{{ r.bg }}; box-shadow:{{ r.line }}; opacity:{{ r.op }}; cursor:{{ r.cur }}; transition:background .12s;">
          <sc-if value="{{ r.selMode }}" hint-placeholder-val="{{ false }}">
            <span style="flex:none; width:20px; height:20px; margin-top:1px; display:grid; place-items:center; border-radius:6px; border:1.5px solid {{ r.sBd }}; background:{{ r.sBg }}; color:#1A0A05;"><sc-if value="{{ r.selOn }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:3; stroke-linecap:round; stroke-linejoin:round;"><path d="M5 12l5 5 9-10"></path></svg></sc-if></span>
          </sc-if>
          <sc-if value="{{ r.notSel }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ r.toggle }}" title="{{ r.checkTitle }}" style="flex:none; width:20px; height:20px; margin-top:1px; padding:0; display:grid; place-items:center; border-radius:50%; border:1.5px solid {{ r.ring }}; background:{{ r.fill }}; cursor:pointer; color:#0A0E13; transition:all .15s;" style-hover="background:{{ r.hovFill }};"><sc-if value="{{ r.done }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round;"><path d="M5 12l5 5 9-10"></path></svg></sc-if></button>
          </sc-if>
          <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;">
            <sc-if value="{{ r.editing }}" hint-placeholder-val="{{ false }}"><input ref="{{ focusRef }}" value="{{ editText }}" onChange="{{ onEditText }}" onKeyDown="{{ editKey }}" onBlur="{{ editSave }}" style="height:24px; margin:-2px 0; padding:0 6px; border-radius:6px; border:1px solid rgba(255,123,92,0.5); background:rgba(6,9,13,0.6); color:#E8EEF3; font-family:inherit; font-size:14px; outline:none;"></sc-if>
            <sc-if value="{{ r.notEditing }}" hint-placeholder-val="{{ true }}"><div onDoubleClick="{{ r.startEdit }}" style="font-size:14px; line-height:1.4; color:{{ r.tc }}; text-decoration:{{ r.deco }}; text-decoration-color:rgba(255,255,255,0.3); text-wrap:pretty; word-break:break-word;">{{ r.text }}</div></sc-if>
            <sc-if value="{{ r.hasMeta }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11px;">
                <sc-if value="{{ r.hasDue }}" hint-placeholder-val="{{ false }}"><span style="flex:none; white-space:nowrap; display:flex; align-items:center; gap:4px; font-weight:650; color:{{ r.dueC }};"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2; stroke-linecap:round; stroke-linejoin:round;"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg>{{ r.dueTxt }}</span></sc-if>
                <sc-if value="{{ r.hasPrio }}" hint-placeholder-val="{{ false }}"><span style="flex:none; white-space:nowrap; display:flex; align-items:center; gap:3px; font-weight:650; color:{{ r.prioC }};"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>{{ r.prioL }}</span></sc-if>
                <sc-if value="{{ r.showProj }}" hint-placeholder-val="{{ false }}"><span style="flex:none; white-space:nowrap; display:flex; align-items:center; gap:5px; color:#93A1B0;"><span style="width:6px; height:6px; border-radius:2px; background:{{ r.projC }};"></span>{{ r.proj }}</span></sc-if>
              </div>
            </sc-if>
          </div>
          <sc-if value="{{ r.showActs }}" hint-placeholder-val="{{ false }}">
            <div data-todo-menu="1" style="position:relative; flex:none; display:flex; gap:1px; margin:-3px 0;">
              <button onClick="{{ r.menuToggle }}" title="Options" style="width:26px; height:26px; display:grid; place-items:center; border-radius:7px; border:0; background:{{ r.menuBg }}; cursor:pointer; color:#93A1B0;" style-hover="background:rgba(255,255,255,0.08); color:#E8EEF3;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:3; stroke-linecap:round;"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button>
              <button onClick="{{ r.del }}" title="Delete" style="width:26px; height:26px; display:grid; place-items:center; border-radius:7px; border:0; background:transparent; cursor:pointer; color:#6B7A8A;" style-hover="background:rgba(255,84,112,0.12); color:#FF8FA2;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
              <sc-if value="{{ r.menuOpen }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute; top:calc(100% + 4px); right:0; z-index:40; width:230px; padding:6px; border-radius:13px; background:rgba(15,21,29,0.98); border:1px solid rgba(255,255,255,0.1); box-shadow:0 22px 54px -18px rgba(0,0,0,0.9); animation:denRise .14s cubic-bezier(.2,.7,.3,1);">
                  <button onClick="{{ r.startEdit }}" style="width:100%; display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px; border:0; background:transparent; cursor:pointer; text-align:left; font-family:inherit; font-size:12.5px; font-weight:600; color:#E8EEF3;" style-hover="background:rgba(255,255,255,0.05);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Edit text</button>
                  <div style="padding:6px 9px 4px; font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:.12em; color:#6B7A8A;">PRIORITY</div>
                  <div style="display:flex; gap:3px; padding:0 6px 4px;"><sc-for list="{{ r.prios }}" as="p" hint-placeholder-count="4"><button onClick="{{ p.pick }}" style="flex:1; height:28px; border-radius:8px; border:1px solid {{ p.bd }}; background:{{ p.bg }}; cursor:pointer; font-family:inherit; font-size:11px; font-weight:650; color:{{ p.c }};">{{ p.label }}</button></sc-for></div>
                  <div style="padding:6px 9px 4px; font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:.12em; color:#6B7A8A;">DUE</div>
                  <div style="display:flex; gap:3px; flex-wrap:wrap; padding:0 6px 4px;"><sc-for list="{{ r.dues }}" as="d" hint-placeholder-count="4"><button onClick="{{ d.pick }}" style="height:26px; padding:0 8px; border-radius:999px; border:1px solid {{ d.bd }}; background:{{ d.bg }}; cursor:pointer; font-family:inherit; font-size:11px; font-weight:650; color:{{ d.fg }};">{{ d.label }}</button></sc-for></div>
                  <div style="padding:6px 9px 4px; font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:.12em; color:#6B7A8A;">PROJECT</div>
                  <sc-for list="{{ r.projs }}" as="p" hint-placeholder-count="5"><button onClick="{{ p.pick }}" style="width:100%; display:flex; align-items:center; gap:8px; padding:6px 9px; border-radius:8px; border:0; background:{{ p.bg }}; cursor:pointer; text-align:left; font-family:inherit; font-size:12.5px; font-weight:600; color:#E8EEF3;"><span style="width:7px; height:7px; border-radius:2px; background:{{ p.c }};"></span><span style="flex:1;">{{ p.name }}</span><sc-if value="{{ p.on }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FF7B5C" style="stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;"><path d="M5 12l5 5 9-10"></path></svg></sc-if></button></sc-for>
                  <div style="height:1px; margin:5px 4px; background:rgba(255,255,255,0.06);"></div>
                  <button onClick="{{ r.toQueue }}" style="width:100%; display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px; border:0; background:transparent; cursor:pointer; text-align:left; font-family:inherit; font-size:12.5px; font-weight:600; color:#FFA48C;" style-hover="background:rgba(255,123,92,0.08);"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"></path></svg>Send to Octopus queue</button>
                  <button onClick="{{ r.dup }}" style="width:100%; display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px; border:0; background:transparent; cursor:pointer; text-align:left; font-family:inherit; font-size:12.5px; font-weight:600; color:#E8EEF3;" style-hover="background:rgba(255,255,255,0.05);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;"><path d="M8 8h12v12H8zM4 16V4h12"></path></svg>Duplicate</button>
                </div>
              </sc-if>
            </div>
          </sc-if>
        </div>
      </sc-if>
    </div></sc-for>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:28px 14px; border-radius:14px; border:1px dashed rgba(255,255,255,0.1); text-align:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6A7A" style="stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>
        <span style="font-size:13px; font-weight:650; color:#C2CDD8;">{{ emptyTitle }}</span>
        <span style="font-size:11.5px; line-height:1.5; color:#6B7A8A;">{{ emptySub }}</span>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ selMode }}" hint-placeholder-val="{{ false }}">
    <div style="position:sticky; bottom:0; z-index:20; display:flex; align-items:center; gap:4px; flex-wrap:wrap; padding:8px; border-radius:14px; background:rgba(15,21,29,0.96); border:1px solid rgba(255,255,255,0.1); box-shadow:0 -10px 30px -12px rgba(0,0,0,0.7); backdrop-filter:blur(18px);">
